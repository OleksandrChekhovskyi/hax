name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # --init gives container jobs a reaping PID 1: the task tests assert that
    # killed orphans disappear, but GitHub runs steps beside a pause process
    # that never reaps, so the zombies would outlive the assertions.
    container:
      image: ${{ matrix.container }}
      options: --init
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `lint` runs where the toolchain pins the range .clang-tidy promises
        # to stay clean for ("Debian stable's LLVM through current"): Debian
        # stable is the old end, Arch the new end, and macOS covers Homebrew's
        # LLVM. Alpine's musl LLVM adds a fourth variant with no coverage
        # benefit, so it does not lint.
        include:
          - name: ubuntu
            os: ubuntu-26.04
          - name: ubuntu-asan
            os: ubuntu-26.04
            build_dir: build-asan
          - name: ubuntu-tsan
            os: ubuntu-26.04
            build_dir: build-tsan
          - name: ubuntu-arm64
            os: ubuntu-26.04-arm
          - name: debian
            os: ubuntu-latest
            container: debian:stable
            lint: true
          - name: arch
            os: ubuntu-latest
            container: archlinux:latest
            lint: true
          - name: alpine
            os: ubuntu-latest
            container: alpine:latest
          - name: macos
            os: macos-latest
            lint: true
    env:
      BUILD_DIR: ${{ matrix.build_dir || 'build' }}
      # Marks the job's system as disposable: install_deps.sh may sync-and-upgrade
      # it wholesale. True only for the container entries, never for runner hosts.
      HAX_DEPS_UPGRADE: ${{ matrix.container && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: scripts/install_deps.sh ci ${{ matrix.lint && 'lint' || '' }}
      - name: Build and test
        run: make tests
      - name: Lint
        if: ${{ matrix.lint }}
        run: make lint

  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install Meson and Ninja
        run: python -m pip install meson ninja
      - name: Build from clean wraps
        env:
          CC: clang-cl
        run: |
          meson setup build-win
          meson compile -C build-win
      - name: Test
        run: meson test -C build-win --print-errorlogs
      - name: Verify standalone native imports
        shell: pwsh
        run: |
          $readobj = "$env:ProgramFiles\LLVM\bin\llvm-readobj.exe"
          $imports = & $readobj --coff-imports build-win\hax.exe | Out-String
          $imports | Write-Host
          $forbidden = '(?i)(msys-2\.0|cygwin1|pthread|libcurl|jansson|vcruntime[^.]*|' +
                       'msvcp[^.]*|ucrtbase|api-ms-win-crt-[^.]+)\.dll'
          if ($imports -match $forbidden) {
            throw 'hax.exe imports a forbidden compatibility, dependency, or C runtime DLL'
          }

  # GitHub has no BSD runners, so these boot a QEMU guest on a Linux runner and
  # take longer than the container jobs above. They cannot join that matrix: the
  # whole body has to run inside the VM, which the `cpa.sh` shell arranges.
  bsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: freebsd
            operating_system: freebsd
            version: '15.1'
          - name: openbsd
            operating_system: openbsd
            version: '7.9'
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v7
      - name: Start VM
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: ${{ matrix.operating_system }}
          version: ${{ matrix.version }}
      - name: Install dependencies
        run: scripts/install_deps.sh ci
      - name: Build and test
        run: make tests
