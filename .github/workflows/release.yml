name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Linux builds run in build_linux.sh's own podman container, not a job-level
  # Alpine one: the runner rejects JavaScript actions in musl containers on
  # anything but x64, so that layout cannot check out on arm64.
  binary:
    name: binary (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux
            arch: x86_64
          - os: ubuntu-26.04-arm
            platform: linux
            arch: aarch64
          - os: macos-latest
            platform: macos
            arch: arm64
    env:
      BUILD_DIR: build-dist
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches project version
        run: |
          grep -Fq "version: '${GITHUB_REF_NAME#v}'," meson.build
      # build_linux.sh provisions its own container.
      - name: Install dependencies
        if: ${{ matrix.platform == 'macos' }}
        run: scripts/install_deps.sh ci
      # Built from a git-less snapshot so version.h takes the vcs_tag fallback:
      # exactly the declared project version, pinned to the tag by the check
      # above. The shallow checkout's `git describe` would be a bare hash.
      - name: Build and test binary
        run: |
          mkdir snapshot
          git archive HEAD | tar -x -C snapshot
          snapshot/scripts/build_${{ matrix.platform }}.sh
      # The binary ships under its canonical name inside a platform-tagged tarball:
      # hax spawns subagents by invoking `hax`, so it must land in PATH as that.
      - name: Package
        run: |
          tar -C "snapshot/$BUILD_DIR" -czf \
              "hax-${GITHUB_REF_NAME#v}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" hax
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: hax-*.tar.gz
          if-no-files-found: error

  # The Workshop SDK wraps the Linux binary, so Workshop users install the very
  # artifact this release built. sdkcraft.yaml sources that binary from the
  # `binary` job's tarball rather than a published URL, hence needs: binary; the
  # SDK's version is adopted from meson.build, which the check below pins to the tag.
  sdk:
    name: sdk (ubuntu@26.04-amd64)
    runs-on: ubuntu-26.04
    needs: binary
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches project version
        run: |
          grep -Fq "version: '${GITHUB_REF_NAME#v}'," meson.build
      # SDKcraft ships as a classic snap; the runner's snapd installs it.
      - name: Install SDKcraft
        run: sudo snap install sdkcraft --classic
      - uses: actions/download-artifact@v8
        with:
          name: binary-linux-x86_64
          path: dist
      # Destructive mode: the runner is the SDK's ubuntu@26.04 base and the part only
      # dumps a static binary, so no build environment beyond the host is needed. The
      # part's source is a fixed path, so strip the version from the downloaded name.
      - name: Build the SDK
        run: |
          mv dist/hax-*-linux-x86_64.tar.gz dist/hax-linux-x86_64.tar.gz
          sdkcraft pack --destructive-mode
      - uses: actions/upload-artifact@v7
        with:
          name: sdk
          path: hax_amd64_ubuntu@26.04.sdk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: binary
    timeout-minutes: 30
    steps:
      # Full history so `git describe` (baked into the binary via version.h)
      # sees the tag; a shallow checkout has no tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tag matches project version
        run: |
          grep -Fq "version: '${GITHUB_REF_NAME#v}'," meson.build
      - name: Install dependencies
        run: scripts/install_deps.sh ci
      # `meson dist` archives the sources, then builds and runs the test suite
      # against the unpacked tarball — the artifact is validated as shipped.
      - name: Build and test source tarball
        run: |
          meson setup build
          meson dist -C build
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect artifacts and checksums
        run: |
          cp build/meson-dist/*.tar.xz artifacts/
          (cd artifacts && sha256sum -- *.tar.* > SHA256SUMS)
      - name: Extract release notes
        run: scripts/maint/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      # Prerelease tags must not become `releases/latest`, which the README's
      # install instructions and the tap formula bumps resolve.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          gh release create "$GITHUB_REF_NAME" --title "hax $GITHUB_REF_NAME" \
              --prerelease="$prerelease" --notes-file notes.md artifacts/*

  # Workshops install SDKs by name from the SDK Store, so that is where the packed SDK
  # is published; the GitHub release carries only the binaries and the source tarball.
  # `sdkcraft upload` registers the name on first use, then uploads the revision and
  # releases it in one step. Unlike the repository bumps below, the store has channels,
  # so prereleases publish too: -rc.N tags to latest/candidate and anything else to
  # latest/edge, leaving latest/stable tracking the newest stable release.
  store:
    runs-on: ubuntu-26.04
    needs: release
    # Nothing here writes to this repository; the store account is reached through
    # SDKCRAFT_STORE_CREDENTIALS (see docs/releasing.md), not the workflow token.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdk
          path: .
      # SDKcraft ships as a classic snap; the runner's snapd installs it.
      - name: Install SDKcraft
        run: sudo snap install sdkcraft --classic
      - name: Upload and release to the SDK Store
        env:
          SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS }}
        run: |
          test -n "$SDKCRAFT_STORE_CREDENTIALS" || {
              echo 'SDKCRAFT_STORE_CREDENTIALS is not set' >&2; exit 1; }
          # The channel follows the tag's shape. A bare vX.Y.Z is a stable release; a
          # vX.Y.Z-rc.N tag is a release candidate; anything else (another prerelease
          # suffix, or a malformed tag) goes to edge rather than risk the stable channel.
          if   [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              channel=latest/stable
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              channel=latest/candidate
          else
              channel=latest/edge
          fi
          sdkcraft upload hax_amd64_ubuntu@26.04.sdk --release "$channel"

  # The tap is another repository, beyond the workflow token's reach, hence
  # HOMEBREW_TAP_TOKEN (see docs/releasing.md).
  homebrew:
    runs-on: ubuntu-latest
    needs: release
    # Homebrew has no prerelease channel: the formula tracks one version, so a
    # prerelease bump would replace the stable install for every brew user.
    if: ${{ !contains(github.ref_name, '-') }}
    # The bump pushes to the tap with its own PAT, never to this repository.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bump tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/maint/bump_homebrew.py "${GITHUB_REF_NAME#v}"

  # The site is another repository, beyond the workflow token's reach, hence
  # SITE_TOKEN (see docs/releasing.md).
  site:
    runs-on: ubuntu-latest
    needs: release
    # The site documents the release `releases/latest` serves, which a prerelease is not.
    if: ${{ !contains(github.ref_name, '-') }}
    # The bump pushes to the site with its own PAT, never to this repository.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The site renders its manual from a hax build of the release's source tarball.
      - name: Install dependencies
        run: scripts/install_deps.sh ci
      - name: Bump site manual
        env:
          GH_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: scripts/maint/bump_site.py "${GITHUB_REF_NAME#v}"

  # AUR_SSH_KEY can write every package on the AUR account (see docs/releasing.md),
  # hence the care below to keep it away from the PKGBUILD that makepkg runs.
  aur:
    runs-on: ubuntu-latest
    needs: release
    # The AUR package tracks one version, so a prerelease would replace the stable
    # install for every Arch user, exactly as for the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    # .SRCINFO has to be regenerated by makepkg, which ships only on Arch: the AUR
    # rejects a push whose .SRCINFO disagrees with its PKGBUILD.
    container: archlinux:base-devel
    # Nothing here writes to this repository, and makepkg below runs the PKGBUILD as
    # shell: a write-scoped token must not be reachable from it.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Official Arch images strip the keyring's local master key, leaving keyring
      # upgrades unable to sign newly added packager keys, so regenerate it first — as
      # install_deps.sh does.
      - name: Install container dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git openssh python
      - uses: actions/checkout@v7
        with:
          # Otherwise the token lands in .git/config, and the workspace is handed to the
          # user that runs makepkg.
          persist-credentials: false
      - name: Bump AUR package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          test -n "$AUR_SSH_KEY" || { echo 'AUR_SSH_KEY is not set' >&2; exit 1; }
          # makepkg refuses to run as root, so the bump runs as an unprivileged user.
          # Only the pinned host key is placed on disk: the private key stays in the
          # environment until the script drops it, which it does before running makepkg.
          useradd -m build
          install -d -m 700 -o build -g build /home/build/.ssh
          install -m 644 -o build -g build .github/aur_known_hosts \
              /home/build/.ssh/known_hosts
          chown -R build .
          su build -c "scripts/maint/bump_aur.py '${GITHUB_REF_NAME#v}'"
