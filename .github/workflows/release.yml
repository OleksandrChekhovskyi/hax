name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: platforms
        run: echo "matrix=$(jq -c '{include: .}' release-platforms.json)" >> "$GITHUB_OUTPUT"

  # Linux builds run in build_linux.sh's own podman container, not a job-level
  # Alpine one: the runner rejects JavaScript actions in musl containers on
  # anything but x64, so that layout cannot check out on arm64.
  binary:
    needs: release-matrix
    name: binary (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.release-matrix.outputs.matrix) }}
    env:
      BUILD_DIR: build-dist
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches project version
        run: |
          grep -Fq "version: '${GITHUB_REF_NAME#v}'," meson.build
      # build_linux.sh provisions its own container.
      - name: Install dependencies
        if: ${{ matrix.platform == 'macos' }}
        run: scripts/install_deps.sh ci
      # Built from a git-less snapshot so version.h takes the vcs_tag fallback:
      # exactly the declared project version, pinned to the tag by the check
      # above. The shallow checkout's `git describe` would be a bare hash.
      - name: Build and test binary
        run: |
          mkdir snapshot
          git archive HEAD | tar -x -C snapshot
          snapshot/scripts/build_${{ matrix.platform }}.sh
      # The binary ships under its canonical name inside a platform-tagged tarball:
      # hax spawns subagents by invoking `hax`, so it must land in PATH as that.
      - name: Package
        run: |
          tar -C "snapshot/$BUILD_DIR" -czf \
              "hax-${GITHUB_REF_NAME#v}-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" hax
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: hax-*.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: binary
    timeout-minutes: 30
    steps:
      # Full history so `git describe` (baked into the binary via version.h)
      # sees the tag; a shallow checkout has no tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tag matches project version
        run: |
          grep -Fq "version: '${GITHUB_REF_NAME#v}'," meson.build
      - name: Install dependencies
        run: scripts/install_deps.sh ci
      # `meson dist` archives the sources, then builds and runs the test suite
      # against the unpacked tarball — the artifact is validated as shipped.
      - name: Build and test source tarball
        run: |
          meson setup build
          meson dist -C build
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect artifacts and checksums
        run: |
          cp build/meson-dist/*.tar.xz artifacts/
          (cd artifacts && sha256sum -- *.tar.* > SHA256SUMS)
      - name: Extract release notes
        run: scripts/maint/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      # Prerelease tags must not become `releases/latest`, which the README's
      # install instructions and the tap formula bumps resolve.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          gh release create "$GITHUB_REF_NAME" --title "hax $GITHUB_REF_NAME" \
              --prerelease="$prerelease" --notes-file notes.md artifacts/*

  # The tap is another repository, beyond the workflow token's reach, hence
  # HOMEBREW_TAP_TOKEN (see docs/releasing.md).
  homebrew:
    runs-on: ubuntu-latest
    needs: release
    # Homebrew has no prerelease channel: the formula tracks one version, so a
    # prerelease bump would replace the stable install for every brew user.
    if: ${{ !contains(github.ref_name, '-') }}
    # The bump pushes to the tap with its own PAT, never to this repository.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bump tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/maint/bump_homebrew.py "${GITHUB_REF_NAME#v}"

  # AUR_SSH_KEY can write every package on the AUR account (see docs/releasing.md),
  # hence the care below to keep it away from the PKGBUILD that makepkg runs.
  aur:
    runs-on: ubuntu-latest
    needs: release
    # The AUR package tracks one version, so a prerelease would replace the stable
    # install for every Arch user, exactly as for the tap.
    if: ${{ !contains(github.ref_name, '-') }}
    # .SRCINFO has to be regenerated by makepkg, which ships only on Arch: the AUR
    # rejects a push whose .SRCINFO disagrees with its PKGBUILD.
    container: archlinux:base-devel
    # Nothing here writes to this repository, and makepkg below runs the PKGBUILD as
    # shell: a write-scoped token must not be reachable from it.
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      # Official Arch images strip the keyring's local master key, leaving keyring
      # upgrades unable to sign newly added packager keys, so regenerate it first — as
      # install_deps.sh does.
      - name: Install container dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git openssh python
      - uses: actions/checkout@v7
        with:
          # Otherwise the token lands in .git/config, and the workspace is handed to the
          # user that runs makepkg.
          persist-credentials: false
      - name: Bump AUR package
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          test -n "$AUR_SSH_KEY" || { echo 'AUR_SSH_KEY is not set' >&2; exit 1; }
          # makepkg refuses to run as root, so the bump runs as an unprivileged user.
          # Only the pinned host key is placed on disk: the private key stays in the
          # environment until the script drops it, which it does before running makepkg.
          useradd -m build
          install -d -m 700 -o build -g build /home/build/.ssh
          install -m 644 -o build -g build .github/aur_known_hosts \
              /home/build/.ssh/known_hosts
          chown -R build .
          su build -c "scripts/maint/bump_aur.py '${GITHUB_REF_NAME#v}'"
